[project]
name = "kelana-ai-backend"
version = "0.1.0"
requires-python = "==3.12.*"

dependencies = [
    "fastapi[standard]==0.115.6",
    "uvicorn==0.32.1",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.0.0",
    "boto3==1.43.56",
    "bcrypt",
    "python-jose[cryptography]",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.setuptools]
py-modules = ["main", "database"]

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "services*"]